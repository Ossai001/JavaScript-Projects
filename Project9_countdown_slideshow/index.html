<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Countdown and Slideshow</title>

    <!-- Connect the HTML page to the external CSS file. -->
    <link rel="stylesheet" href="CSS/main.css">
</head>

<body>
    <header>
        <h1>JavaScript Countdown and Slideshow</h1>
    </header>

    <main>
        <!-- COUNTDOWN ASSIGNMENT -->

        <section class="countdown-section">
            <h2>Countdown Timer</h2>

            <p>How many seconds would you like to set your alarm for?</p>

            <input
                id="seconds"
                type="number"
                min="1"
                value=""
                placeholder="Enter seconds"
            >

            <button onclick="countdown()">Start Countdown</button>

            <p id="timer"></p>
        </section>

        <!-- SLIDESHOW CHALLENGE -->

        <section class="slideshow-section">
            <h2>Luxury Car Slideshow</h2>

            <p>
                Use the arrows or dots to move between the images.
            </p>

            <div class="slideshow-container">
                <!-- First slide -->
                <div class="car-slide fade">
                    <div class="slide-number">1 / 3</div>

                    <img
                        src="Img/Alfa.jpg"
                        alt="Alfa Romeo luxury car"
                    >

                    <div class="slide-caption">Alfa Romeo</div>
                </div>

                <!-- Second slide -->
                <div class="car-slide fade">
                    <div class="slide-number">2 / 3</div>

                    <img
                        src="Img/ferrari.jpg"
                        alt="Ferrari sports car"
                    >

                    <div class="slide-caption">Ferrari</div>
                </div>

                <!-- Third slide -->
                <div class="car-slide fade">
                    <div class="slide-number">3 / 3</div>

                    <img
                        src="Img/Gayot.jpg"
                        alt="Gayot luxury car"
                    >

                    <div class="slide-caption">Luxury Performance</div>
                </div>

                <!-- Previous and next controls -->
                <button
                    class="previous"
                    onclick="changeSlide(-1)"
                    aria-label="Previous slide"
                >
                    &#10094;
                </button>

                <button
                    class="next"
                    onclick="changeSlide(1)"
                    aria-label="Next slide"
                >
                    &#10095;
                </button>
            </div>

            <!-- Slideshow navigation dots -->
            <div class="dot-container">
                <button
                    class="dot"
                    onclick="currentSlide(1)"
                    aria-label="Display slide 1"
                ></button>

                <button
                    class="dot"
                    onclick="currentSlide(2)"
                    aria-label="Display slide 2"
                ></button>

                <button
                    class="dot"
                    onclick="currentSlide(3)"
                    aria-label="Display slide 3"
                ></button>
            </div>
        </section>
    </main>

    <!-- Connect the HTML page to the external JavaScript file. -->
    <script src="JS/main.js"></script>
</body>
</html>
