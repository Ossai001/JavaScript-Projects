<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chukwuka's Calculator</title>

    <meta
        name="description"
        content="A basic HTML, CSS and JavaScript calculator"
    >

    <meta
        name="author"
        content="Chukwuka Ossai"
    >

    <!-- Links calculator.html to Calculator_CSS.css. -->
    <link
        rel="stylesheet"
        type="text/css"
        href="./CSS/Calculator_CSS.css"
    >

    <!-- Links calculator.html to its JavaScript file. -->
    <script
        src="./JavaScript/Calculator_JavaScript.js"
        defer
    ></script>
</head>

<body>

    <!-- Main calculator container. -->
    <div class="calculator">

        <!-- Displays numbers and calculation results. -->
        <input
            type="text"
            class="calculator-screen"
            value="0"
            aria-label="Calculator display"
            disabled
        >

        <!-- Contains all the calculator buttons. -->
        <div class="calculator-keys">

            <!-- Mathematical operator buttons. -->
            <button
                type="button"
                class="operator"
                value="+"
            >
                +
            </button>

            <button
                type="button"
                class="operator"
                value="-"
            >
                −
            </button>

            <button
                type="button"
                class="operator"
                value="*"
            >
                &times;
            </button>

            <button
                type="button"
                class="operator"
                value="/"
            >
                &divide;
            </button>

            <!-- Number buttons. -->
            <button type="button" value="7">7</button>
            <button type="button" value="8">8</button>
            <button type="button" value="9">9</button>

            <button type="button" value="4">4</button>
            <button type="button" value="5">5</button>
            <button type="button" value="6">6</button>

            <button type="button" value="1">1</button>
            <button type="button" value="2">2</button>
            <button type="button" value="3">3</button>

            <button type="button" value="0">0</button>

            <!-- Decimal button. -->
            <button
                type="button"
                class="decimal function"
                value="."
            >
                .
            </button>

            <!-- Clears the calculator. -->
            <button
                type="button"
                class="all-clear function"
                value="all-clear"
            >
                AC
            </button>

            <!-- Displays the calculation result. -->
            <button
                type="button"
                class="equal-sign operator"
                value="="
            >
                =
            </button>

        </div>
    </div>

</body>

</html>
